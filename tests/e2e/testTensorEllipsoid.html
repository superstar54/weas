<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WEAS Tensor Ellipsoid Demo</title>
    <link rel="stylesheet" href="../../src/style.css" />
  </head>
  <body>
    <h2>Tensor Ellipsoid Demo</h2>
    <p>Ellipsoids represent anisotropic displacement parameters or tensor quantities at each atom position.</p>
    <div id="viewer" style="position: relative; width: 800px; height: 600px"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js",
          "dat.gui": "../../node_modules/dat.gui/build/dat.gui.module.js",
          "three/examples/jsm/renderers/CSS2DRenderer.js": "../../node_modules/three/examples/jsm/renderers/CSS2DRenderer.js",
          "three/examples/jsm/geometries/ConvexGeometry.js": "../../node_modules/three/examples/jsm/geometries/ConvexGeometry.js",
          "three/examples/jsm/math/ConvexHull.js": "../../node_modules/three/examples/jsm/math/ConvexHull.js",
          "three/examples/jsm/interactive/SelectionBox.js": "../../node_modules/three/examples/jsm/interactive/SelectionBox.js",
          "three/examples/jsm/interactive/SelectionHelper.js": "../../node_modules/three/examples/jsm/interactive/SelectionHelper.js",
          "three/examples/jsm/utils/BufferGeometryUtils.js": "../../node_modules/three/examples/jsm/utils/BufferGeometryUtils.js"
        }
      }
    </script>

    <script type="module">
      import { WEAS, parseXYZ } from "../../src/index.js";

      async function fetchFile(filename) {
        const response = await fetch(`../../demo/datas/${filename}`);
        if (!response.ok) {
          throw new Error(`Failed to load file: ${filename}`);
        }
        return await response.text();
      }

      let domElement = document.getElementById("viewer");
      const filename = "c2h6so.xyz";

      fetchFile(filename).then((fileContent) => {
        const atoms = parseXYZ(fileContent);
        const editor = new WEAS({ domElement });
        editor.avr.atoms = atoms;

        // Add tensor ellipsoid data
        const nAtoms = atoms[0].getAtomsCount();
        const eigenvalues = [];
        const eigenvectors = [];

        for (let i = 0; i < nAtoms; i++) {
          // Create anisotropic ellipsoids: different radii along different axes
          const scale = 0.3 + Math.random() * 0.4;
          eigenvalues.push([scale * 1.5, scale * 1.0, scale * 0.5]);

          // Random rotation for eigenvectors
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.random() * Math.PI;
          const psi = Math.random() * Math.PI * 2;

          // Rotation matrix from Euler angles (ZYZ convention)
          const c1 = Math.cos(theta), s1 = Math.sin(theta);
          const c2 = Math.cos(phi), s2 = Math.sin(phi);
          const c3 = Math.cos(psi), s3 = Math.sin(psi);

          const v1 = [c1 * c2 * c3 - s1 * s3, s1 * c2 * c3 + c1 * s3, -s2 * c3];
          const v2 = [-c1 * c2 * s3 - s1 * c3, -s1 * c2 * s3 + c1 * c3, s2 * s3];
          const v3 = [c1 * s2, s1 * s2, c2];

          eigenvectors.push([v1, v2, v3]);
        }

        editor.avr.tensorEllipsoidManager.addSetting("default", {
          origins: "positions",
          eigenvalues: eigenvalues,
          eigenvectors: eigenvectors,
          scale: 1.2,
          color: "#ff6b35",
          opacity: 0.5,
          resolution: 32,
          renderMode: "solid",
          showPrincipalAxes: true,
          principalAxisLength: 1.5,
          principalAxisRadius: 0.03,
        });

        editor.avr.tensorEllipsoidManager.drawTensorEllipsoids();
        editor.avr.tjs.updateCameraAndControls({ direction: [0, 1, 0] });
        editor.avr.drawModels();
        editor.render();
        window.editor = editor;
      });
    </script>
  </body>
</html>
