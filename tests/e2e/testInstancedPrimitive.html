<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WEAS Test</title>
  </head>
  <body>
    <div
      id="viewer"
      style="position: relative; width: 960px; height: 640px"
    ></div>

    <script src="../../dist/index.iife.js"></script>
    
    <script type="module">

      async function fetchFile(filename) {
        const response = await fetch(`../../demo/datas/${filename}`);
        if (!response.ok) {
          throw new Error(`Failed to load file for structure: ${filename}`);
        }
        return await response.text();
      }

      let domElement = document.getElementById("viewer");
      // read atoms from file
      const filename = "mesh_primitives_settings.json";
      fetchFile(filename).then((fileContent) => {
        const data = JSON.parse(fileContent);
        let editor = new weas.WEAS({ domElement });
        editor.instancedMeshPrimitive.setSettings(data);
        editor.selectionManager.selectedObjects = [editor.instancedMeshPrimitive.meshes[3]];
        editor.render();
      });
    </script>
  </body>
</html>
